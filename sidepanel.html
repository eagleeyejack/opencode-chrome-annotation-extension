<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenCode Annotation</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 10px;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #111111;
        background: #ffffff;
        overflow-x: hidden;
      }
      button, textarea { font: inherit; }
      button, .textarea, .search, .session-row, .queue-item, .history-item {
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease, opacity 140ms ease;
      }
      :focus-visible { outline: 2px solid #818cf8; outline-offset: 1px; }
      .ic { flex: none; }
      .ic * { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .logo { width: 20px; height: 20px; border-radius: 6px; flex: none; }
      .root { display: flex; flex-direction: column; gap: 12px; min-height: calc(100vh - 20px); }
      .root:has(.send-bar) .toast { bottom: 72px; }
      .section { display: flex; flex-direction: column; gap: 8px; }
      .contents { display: contents; }
      .chat-header {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: -10px -10px 0;
        padding: 10px;
        background: #ffffff;
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }
      .send-bar {
        position: sticky;
        bottom: 0;
        z-index: 10;
        margin: auto -10px -10px;
        padding: 10px;
        background: #ffffff;
        border-top: 1px solid rgba(0,0,0,0.06);
      }
      .send-bar .btn { padding: 11px 12px; font-size: 13px; }
      .picking {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 8px 12px;
        border-radius: 10px;
        background: #eef2ff;
        color: #3730a3;
        font-weight: 600;
      }
      .section-head { display: flex; align-items: center; gap: 2px; }
      .section-head .title { display: flex; align-items: center; gap: 6px; }
      .count {
        min-width: 18px;
        padding: 1px 6px;
        border-radius: 999px;
        background: #f3f4f6;
        color: #4b5563;
        font: 700 11px/1.5 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      .toast {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 100;
        padding: 9px 11px;
        border-radius: 9px;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        animation: toast-in 200ms cubic-bezier(.2,.8,.2,1);
      }
      .toast.error { background: #ffe4e6; }
      .toast.success { background: #d1fae5; }
      @keyframes toast-in {
        from { transform: translateY(10px); opacity: 0; }
      }
      .added-tick {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border-radius: 999px;
        background: #d1fae5;
        color: #065f46;
        font: 700 12px/1.4 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        flex: none;
        animation: pop-in 220ms cubic-bezier(.2,.8,.2,1);
      }
      @keyframes pop-in {
        from { transform: scale(0.6); opacity: 0; }
      }
      .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .title { font-weight: 700; }
      .hint { color: #6b7280; }
      .grow { flex: 1 1 auto; min-width: 0; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row.end { justify-content: flex-end; }
      .row.between { justify-content: space-between; align-items: flex-start; }
      .card {
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 8px;
        padding: 8px 12px;
        background: transparent;
        color: #111111;
        font: 600 12px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) { background: #f3f4f6; }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn.primary {
        border: 0;
        background: #111111;
        color: #ffffff;
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      }
      .btn.primary:hover:not(:disabled) { background: #2b2b2b; }
      .btn.small { padding: 6px 10px; }
      .btn.full { width: 100%; }
      .btn.ghost { border-color: transparent; color: #4b5563; }
      .btn.ghost:hover:not(:disabled) { background: #f3f4f6; color: #111111; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #111111;
        cursor: pointer;
        padding: 0;
        flex: none;
      }
      .icon-btn:hover { background: #f3f4f6; }
      .textarea {
        width: 100%;
        min-height: 84px;
        resize: vertical;
        border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.12);
        background: #ffffff;
        color: #111111;
        padding: 8px;
        box-sizing: border-box;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .textarea:focus { border-color: #818cf8; outline: none; box-shadow: 0 0 0 2px rgba(129,140,248,0.35); }
      .element-info {
        color: #4b5563;
        word-break: break-all;
        background: #f9fafb;
        border-radius: 6px;
        padding: 6px 8px;
        font: 500 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .queue-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 8px 10px 12px;
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 10px;
        background: #ffffff;
      }
      .queue-item:hover { border-color: rgba(0,0,0,0.16); }
      .queue-selector {
        margin-top: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #6b7280;
        font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .queue-meta {
        color: #6b7280;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
        min-width: 0;
      }
      .queue-comment { font-weight: 500; word-break: break-word; line-height: 1.45; }
      .queue-comment.empty { color: #9ca3af; font-style: italic; }
      .queue-item-actions { display: inline-flex; align-items: center; gap: 2px; flex: none; }
      .send-failure {
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #7f1d1d;
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .send-failure-text { line-height: 1.45; word-break: break-word; }
      .history-item { border-radius: 8px; padding: 8px 10px; }
      .history-actions { display: inline-flex; align-items: center; gap: 4px; flex: none; }
      .btn.primary:disabled { opacity: 0.55; }
      .history-error { margin-top: 3px; color: #991b1b; font-size: 12px; word-break: break-word; line-height: 1.45; }
      .status-chip {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        font: 700 11px/1.5 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        flex: none;
      }
      .status-chip.sent { background: #d1fae5; color: #065f46; }
      .status-chip.failed { background: #ffe4e6; color: #7f1d1d; }
      .status-chip.partial { background: #fef3c7; color: #92400e; }
      .linked { display: flex; align-items: center; gap: 8px; }
      .linked-label {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chips-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .chips {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1 1 auto;
        min-width: 0;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.12);
        background: transparent;
        color: #111111;
        cursor: pointer;
        font: 600 12px/1 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        flex: none;
      }
      .chip.toggle { flex: none; }
      .chip > span:not(.project-dot) { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
      /* With room for one project, its chip shrinks to fit instead of clipping. */
      .chips.single .chip { flex-shrink: 1; min-width: 0; }
      .chips.single .chip:first-child { flex-shrink: 0; }
      .linked-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        margin-top: 1px;
        color: #6b7280;
        font-size: 12px;
      }
      .linked-project { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
      .element-row { display: flex; align-items: center; gap: 8px; }
      .chips-more {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: -4px;
      }
      .chips-more.anim { animation: chips-in 200ms cubic-bezier(.2,.8,.2,1); }
      @keyframes chips-in {
        from { opacity: 0; transform: translateY(-3px); }
      }
      .chip.active { background: #111111; color: #ffffff; border-color: #111111; }
      .list { display: flex; flex-direction: column; gap: 2px; padding: 2px 0; }
      .session-item:disabled { cursor: default; opacity: 0.6; }
      .session-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border: 0;
        background: transparent;
        color: #111111;
        cursor: pointer;
        font: 13px/1.35 ui-sans-serif, system-ui, sans-serif;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 8px;
        padding: 2px 4px 2px 2px;
      }
      .session-row:hover { background: #f3f4f6; }
      .session-row.selected { background: #eef2ff; }
      .session-row.selected:hover { background: #e0e7ff; }
      .session-row .session-item { flex: 1 1 auto; min-width: 0; }
      .session-select { flex: none; width: 16px; height: 16px; margin: 0 4px 0 6px; accent-color: #111111; cursor: pointer; }
      .session-select-spacer { flex: none; width: 16px; margin: 0 4px 0 6px; }
      .session-row.unselectable { opacity: 0.45; }
      .session-row.unselectable:hover { background: transparent; }
      .bulk-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 8px;
        background: #f9fafb;
      }
      .bulk-count { font-weight: 700; flex: 1 1 auto; min-width: 0; }
      .btn.confirm { color: #dc2626; border-color: rgba(220,38,38,0.4); background: #fef2f2; animation: confirm-pop 200ms cubic-bezier(.2,.8,.2,1); }
      @keyframes confirm-pop {
        from { transform: scaleX(0.85); opacity: 0.4; }
      }
      .session-name { font-weight: 700; overflow-wrap: anywhere; }
      .session-meta {
        margin-top: 2px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #6b7280;
        font-size: 12px;
        overflow: hidden;
      }
      .project-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: hsl(var(--dot, 0) 55% 55%);
        flex: none;
      }
      .project-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-date { flex: none; color: #6b7280; font-size: 11px; }
      .linked-chip {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 999px;
        background: #bfdbfe;
        color: #111111;
        font: 700 11px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .empty-icon { color: #9ca3af; margin-bottom: 2px; }
      .empty-title { font-weight: 700; margin-bottom: 6px; }
      .empty-text { margin: 0 0 8px; color: #6b7280; line-height: 1.45; }
      .empty-list { margin: 0; padding-left: 18px; color: #6b7280; line-height: 1.5; }
      .search {
        width: 100%;
        padding: 8px 11px;
        border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.12);
        background: #f9fafb;
        color: #111111;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .search::placeholder { color: #9ca3af; }
      .search:focus { border-color: #818cf8; outline: none; box-shadow: 0 0 0 2px rgba(129,140,248,0.35); background: #ffffff; }
      .agent-tabs { display: inline-flex; gap: 4px; flex: none; }
      .agent-tab {
        min-width: 34px;
        height: 35px;
        border-radius: 8px;
        font: 600 12px/1 ui-sans-serif, system-ui, sans-serif;
        border: 1px solid rgba(0,0,0,0.12);
        background: transparent;
        color: #6b7280;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0 8px;
      }
      .agent-tab:hover { background: #f3f4f6; color: #111111; }
      .agent-tab.active { background: #111111; color: #ffffff; border-color: #111111; }
      .agent-glyph { color: #6b7280; display: inline-flex; flex: none; }
      .agent-glyph.claude { color: #D97757; }
      .agent-glyph .brand-ic { color: inherit; }
      .agent-tab .brand-ic { color: inherit; }
      .brand-ic { flex: none; fill: currentColor; stroke: none; }
      .results-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 2px 0;
      }
      .results-label {
        font: 700 11px/1.4 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #6b7280;
      }
      .results-count {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        color: #6b7280;
        font: 600 12px/1 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
      }
      .search-clear { width: 16px; height: 16px; font: 700 12px/1 ui-sans-serif, system-ui, sans-serif; color: #6b7280; }
      .search-clear:hover { color: #111111; }
      @keyframes row-in {
        from { opacity: 0; transform: translateY(3px); }
      }
      .session-row.anim { animation: row-in 180ms ease backwards; animation-delay: calc(var(--i, 0) * 20ms); }
      .root.view-anim.view-chat { animation: view-chat 240ms cubic-bezier(.2,.8,.2,1); }
      .root.view-anim.view-picker { animation: view-picker 240ms cubic-bezier(.2,.8,.2,1); }
      @keyframes view-chat {
        from { opacity: 0; transform: translateX(20px); }
      }
      @keyframes view-picker {
        from { opacity: 0; transform: translateX(-20px); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <script src="sidepanel-dev.js"></script>
    <script src="sidepanel-picker.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
