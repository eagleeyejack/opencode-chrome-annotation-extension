<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenCode Annotation</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 10px;
        font: 12px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #111111;
        background: #ffffff;
        overflow-x: hidden;
      }
      button, textarea { font: inherit; }
      button { transition: background 120ms ease, color 120ms ease, border-color 120ms ease, box-shadow 120ms ease; }
      :focus-visible { outline: 2px solid #818cf8; outline-offset: 1px; }
      .ic { flex: none; }
      .ic * { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .logo { width: 20px; height: 20px; border-radius: 6px; flex: none; }
      .root { display: flex; flex-direction: column; gap: 10px; }
      .section { display: flex; flex-direction: column; gap: 8px; }
      .contents { display: contents; }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -10px -10px 0;
        padding: 10px 10px 8px;
        background: #ffffff;
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }
      .toast {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 100;
        padding: 9px 11px;
        border-radius: 9px;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        animation: toast-in 200ms cubic-bezier(.2,.8,.2,1);
      }
      .toast.error { background: #ffe4e6; }
      .toast.success { background: #d1fae5; }
      @keyframes toast-in {
        from { transform: translateY(10px); opacity: 0; }
      }
      .added-tick {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border-radius: 999px;
        background: #d1fae5;
        color: #065f46;
        font: 700 11px/1.4 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        flex: none;
        animation: pop-in 220ms cubic-bezier(.2,.8,.2,1);
      }
      @keyframes pop-in {
        from { transform: scale(0.6); opacity: 0; }
      }
      .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .title { font-weight: 700; }
      .hint { color: #6b7280; }
      .grow { flex: 1 1 auto; min-width: 0; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row.end { justify-content: flex-end; }
      .row.between { justify-content: space-between; align-items: flex-start; }
      .card {
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 999px;
        padding: 6px 11px;
        background: transparent;
        color: #111111;
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) { background: #f3f4f6; }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn.primary {
        border: 0;
        background: #111111;
        color: #ffffff;
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      }
      .btn.primary:hover:not(:disabled) { background: #2b2b2b; }
      .btn.full { width: 100%; padding: 8px 10px; }
      .btn.small { padding: 5px 8px; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #111111;
        cursor: pointer;
        padding: 0;
        flex: none;
      }
      .icon-btn:hover { background: #f3f4f6; }
      .textarea {
        width: 100%;
        min-height: 84px;
        resize: vertical;
        border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.12);
        background: #ffffff;
        color: #111111;
        padding: 8px;
        box-sizing: border-box;
        font: 12px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .textarea:focus { border-color: #818cf8; outline: none; }
      .element-info {
        color: #4b5563;
        word-break: break-all;
        background: #f9fafb;
        border-radius: 6px;
        padding: 6px 8px;
        font: 500 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .queue-item { border-top: 1px solid rgba(0,0,0,0.08); padding: 6px 2px; }
      .queue-item:hover { background: #fafafa; }
      .queue-meta {
        color: #6b7280;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
        min-width: 0;
      }
      .queue-comment { margin-top: 3px; word-break: break-word; line-height: 1.45; }
      .queue-actions { display: inline-flex; align-items: center; gap: 6px; flex: none; }
      .queue-item-actions { display: inline-flex; align-items: center; gap: 2px; flex: none; }
      .queue-footer { display: flex; justify-content: flex-end; }
      .queue-footer .btn.full { width: 100%; }
      .send-failure {
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #7f1d1d;
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .send-failure-text { line-height: 1.45; word-break: break-word; }
      .history-item { border-top: 1px solid rgba(0,0,0,0.08); padding: 6px 2px; }
      .history-actions { display: inline-flex; align-items: center; gap: 4px; flex: none; }
      .history-error { margin-top: 3px; color: #991b1b; font-size: 11px; word-break: break-word; line-height: 1.45; }
      .status-chip {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        font: 700 10px/1.5 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        flex: none;
      }
      .status-chip.sent { background: #d1fae5; color: #065f46; }
      .status-chip.failed { background: #ffe4e6; color: #7f1d1d; }
      .status-chip.partial { background: #fef3c7; color: #92400e; }
      .linked-label {
        font-weight: 700;
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(0,0,0,0.12);
        background: transparent;
        color: #111111;
        cursor: pointer;
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip.active { background: #111111; color: #ffffff; border-color: #111111; }
      .list { display: flex; flex-direction: column; }
      .session-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 7px 4px;
        border: 0;
        border-bottom: 1px solid rgba(0,0,0,0.08);
        background: transparent;
        color: #111111;
        cursor: pointer;
        border-radius: 0;
        font: 12px/1.35 ui-sans-serif, system-ui, sans-serif;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 8px;
        padding: 0 4px 0 0;
      }
      .session-row:hover { background: #f3f4f6; }
      .session-row.selected { background: #eef2ff; }
      .session-row.selected:hover { background: #e0e7ff; }
      .session-row .session-item { flex: 1 1 auto; min-width: 0; }
      .session-select { flex: none; width: 14px; height: 14px; margin: 0 2px 0 0; accent-color: #111111; cursor: pointer; }
      .bulk-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 8px;
        background: #f9fafb;
      }
      .bulk-count { font-weight: 700; flex: 1 1 auto; min-width: 0; }
      .btn.confirm { color: #dc2626; border-color: rgba(220,38,38,0.4); }
      .session-name { font-weight: 600; overflow-wrap: anywhere; }
      .session-meta { margin-top: 2px; color: #6b7280; font-size: 11px; overflow-wrap: anywhere; }
      .session-date { flex: none; color: #9ca3af; font-size: 10px; }
      .linked-chip {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 999px;
        background: #bfdbfe;
        color: #111111;
        font: 700 10px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .session-close {
        flex: none;
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #9ca3af;
        cursor: pointer;
        padding: 0;
        font: 700 13px/1 ui-sans-serif, system-ui, sans-serif;
      }
      .session-close:hover { background: #f3f4f6; color: #dc2626; }
      .session-close.confirm {
        width: auto;
        padding: 0 8px;
        color: #dc2626;
        font: 700 11px/1 ui-sans-serif, system-ui, sans-serif;
      }
      .empty-icon { color: #9ca3af; margin-bottom: 2px; }
      .empty-title { font-weight: 700; margin-bottom: 6px; }
      .empty-text { margin: 0 0 8px; color: #6b7280; line-height: 1.45; }
      .empty-list { margin: 0; padding-left: 18px; color: #6b7280; line-height: 1.5; }
    </style>
  </head>
  <body>
    <script src="sidepanel.js"></script>
  </body>
</html>
